<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>White Particle Cursor Trail</title><style>
.particle-trail-overlay{position:fixed;inset:0;z-index:250;overflow:hidden;pointer-events:none}
.particle-trail-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;contain:strict}
.particle-trail-dot{position:absolute;top:0;left:0;border-radius:50%;background:#FFFFFF;opacity:0;pointer-events:none;will-change:transform,opacity;box-shadow:0 0 4px #FFFFFF80,0 0 9px #FFFFFF30}
@media(prefers-reduced-motion:reduce),(pointer:coarse){.particle-trail-layer{display:none}}
@media print{.particle-trail-layer,.particle-trail-overlay{display:none!important}}

:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#080d15;color:#f3f7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,1000px)}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
h1{font-size:clamp(22px,4vw,32px);letter-spacing:-.04em;margin:0 0 6px}p{color:#a9b9cd;line-height:1.6;margin:0}
button,input{font:inherit;border:1px solid #486079;background:#17283c;color:#fff;border-radius:8px;padding:10px 14px}
button{cursor:pointer;white-space:nowrap}button:hover{background:#263d57}:focus-visible{outline:3px solid #fff;outline-offset:4px}
.stage{position:relative;isolation:isolate;overflow:hidden;min-height:420px;height:60vh;max-height:650px;border-radius:20px;border:1px solid #2b3c53;display:grid;place-items:center;padding:32px;background:radial-gradient(ellipse at 50% 20%,#1a2941,#10192b 55%,#080e19)}
.stage:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.13;background-image:radial-gradient(#c5dbff 1px,transparent 1px);background-size:22px 22px}
.copy{position:relative;z-index:1;text-align:center;max-width:480px}.copy h2{font-size:clamp(24px,4vw,38px);letter-spacing:-.04em;margin:0 0 12px}
.try{margin-top:24px;display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.try input{min-width:0;width:min(100%,240px)}
.particle-trail-layer{z-index:2}.note{font-size:13px;margin-top:14px}#status{display:block;min-height:24px;color:#cbd9eb}
@media(max-width:600px){body{padding:16px}header{align-items:flex-start;flex-direction:column}.stage{padding:20px;min-height:380px}}
</style></head><body><main>
<header><div><h1>White particle trail</h1><p>A quiet stream of light that follows your pointer.</p></div><button id="toggle" type="button" aria-pressed="true">Particle trail: On</button></header>
<section class="stage" id="preview" aria-label="Interactive particle preview"><div class="copy"><h2>Move your pointer.</h2><p>Move faster for a fuller trail. Slow down and watch the particles drift away.</p><div class="try"><input aria-label="Try typing" placeholder="You can still type here"><button id="try" type="button">Try a click</button></div><p class="note" id="clicks" aria-live="polite">All controls remain interactive.</p></div></section>
<p class="note">48 reusable particles · Native cursor · No external libraries<br><span id="status" role="status"></span></p>
</main><script>
'use strict';
/* Reusable decorative trail. The pool is allocated once, only on eligible devices. */
function createParticleTrail(root, eventTarget = root) {
 const fine = matchMedia('(pointer: fine)'), reduced = matchMedia('(prefers-reduced-motion: reduce)');
 const particles = [];
 let enabled = false, listening = false, destroyed = false, layer = null;
 let next = 0, raf = null, lastFrame = 0, lastMove = 0, lastX = null, lastY = null, credit = 0;
 function resetPath() { lastX = lastY = null; credit = 0; }
 function clear() {
  if (raf !== null) cancelAnimationFrame(raf);
  raf = null; lastFrame = 0; resetPath();
  for (const p of particles) { p.active = false; p.element.style.opacity = '0'; }
 }
 function allocate() {
  if (layer) return;
  layer = document.createElement('div'); layer.className = 'particle-trail-layer'; layer.setAttribute('aria-hidden', 'true');
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < 48; i++) {
   const element = document.createElement('span'); element.className = 'particle-trail-dot'; fragment.append(element);
   particles.push({element, active:false, x:0, y:0, vx:0, vy:0, size:0, born:0, lifetime:0, opacity:0});
  }
  layer.append(fragment); root.append(layer);
 }
 function emit(x, y, dx, dy, speed, now) {
  const p = particles[next]; next = (next + 1) % particles.length;
  const angle = (Math.hypot(dx, dy) > 0 ? Math.atan2(dy, dx) + Math.PI : Math.random() * Math.PI * 2) + (Math.random() - .5) * 1.9;
  const drift = .3 + Math.random() * 1.25 + Math.min(speed * .5, 1);
  p.active = true; p.x = x + (Math.random() - .5) * 5; p.y = y + (Math.random() - .5) * 5;
  p.vx = Math.cos(angle) * drift; p.vy = Math.sin(angle) * drift;
  p.size = 1.5 + Math.random() * 2.8; p.born = now; p.lifetime = 450 + Math.random() * 650; p.opacity = .35 + Math.random() * .5;
  p.element.style.width = p.element.style.height = p.size + 'px'; p.element.style.opacity = '0';
 }
 function animate(now) {
  raf = null;
  if (!listening || document.hidden) { clear(); return; }
  const dt = Math.min(lastFrame ? now - lastFrame : 16.67, 42) / 16.67; lastFrame = now;
  let alive = false;
  for (const p of particles) {
   if (!p.active) continue;
   const age = now - p.born;
   if (age >= p.lifetime) { p.active = false; p.element.style.opacity = '0'; continue; }
   alive = true; p.x += p.vx * dt; p.y += p.vy * dt;
   const drag = Math.pow(.985, dt); p.vx *= drag; p.vy = p.vy * drag + .006 * dt;
   const progress = age / p.lifetime, scale = 1.15 - progress * .5;
   p.element.style.transform = 'translate3d(' + (p.x - p.size / 2) + 'px,' + (p.y - p.size / 2) + 'px,0) scale(' + scale + ')';
   p.element.style.opacity = (p.opacity * Math.min(1, age / 55) * Math.pow(1 - progress, 1.6)).toFixed(3);
  }
  if (alive || now - lastMove < 2000) raf = requestAnimationFrame(animate);
  else { lastFrame = 0; resetPath(); }
 }
 function move(event) {
  if (document.hidden || event.pointerType === 'touch' || event.isPrimary === false) return;
  const rect = root.getBoundingClientRect(), x = event.clientX - rect.left, y = event.clientY - rect.top;
  if (x < 0 || y < 0 || x > rect.width || y > rect.height) { resetPath(); return; }
  const now = performance.now();
  if (lastX === null) { emit(x, y, 0, 0, 0, now); }
  else {
   const dx = x - lastX, dy = y - lastY, distance = Math.hypot(dx, dy);
   if (distance < .1) return;
   const speed = distance / Math.max(8, now - lastMove);
   credit = Math.min(10, credit + distance / (14 - Math.min(speed * 4, 8)));
   const count = Math.floor(credit); credit -= count;
   for (let i = 0; i < count; i++) {
    // Stratified jitter avoids a regularly spaced chain of dots.
    const fraction = (i + Math.random()) / count;
    emit(lastX + dx * fraction, lastY + dy * fraction, dx, dy, speed, now);
   }
  }
  lastX = x; lastY = y; lastMove = now;
  if (raf === null) raf = requestAnimationFrame(animate);
 }
 function leave(event) { if (!event.relatedTarget) resetPath(); }
 function sync() {
  const allowed = !destroyed && enabled && fine.matches && !reduced.matches && !document.hidden;
  if (allowed === listening) return;
  listening = allowed;
  if (allowed) {
   allocate(); resetPath();
   eventTarget.addEventListener('pointermove', move, {passive:true});
   eventTarget.addEventListener('pointerleave', resetPath, {passive:true});
   eventTarget.addEventListener('pointerout', leave, {passive:true});
   window.addEventListener('resize', resetPath, {passive:true});
   window.addEventListener('scroll', resetPath, {passive:true, capture:true});
  } else {
   eventTarget.removeEventListener('pointermove', move); eventTarget.removeEventListener('pointerleave', resetPath); eventTarget.removeEventListener('pointerout', leave);
   window.removeEventListener('resize', resetPath); window.removeEventListener('scroll', resetPath, true); clear();
  }
 }
 fine.addEventListener('change', sync); reduced.addEventListener('change', sync); document.addEventListener('visibilitychange', sync);
 return {
  setEnabled(value) { enabled = value === true; sync(); },
  destroy() {
   if (destroyed) return;
   destroyed = true; sync(); clear(); layer?.remove();
   fine.removeEventListener('change', sync); reduced.removeEventListener('change', sync); document.removeEventListener('visibilitychange', sync);
  }
 };
}

const trail=createParticleTrail(document.querySelector('#preview'));
const fine=matchMedia('(pointer: fine)'), reduced=matchMedia('(prefers-reduced-motion: reduce)');
let enabled=true, clicks=0;
function update(){trail.setEnabled(enabled);document.querySelector('#toggle').textContent='Particle trail: '+(enabled?'On':'Off');document.querySelector('#toggle').setAttribute('aria-pressed',String(enabled));document.querySelector('#status').textContent=!enabled?'Trail is off.':reduced.matches?'Trail paused: reduced motion is enabled.':!fine.matches?'Trail paused: a fine pointer is required.':'Trail is ready. It rests automatically when your pointer is idle.';}
document.querySelector('#toggle').addEventListener('click',()=>{enabled=!enabled;update();});
document.querySelector('#try').addEventListener('click',()=>{document.querySelector('#clicks').textContent='Click received ('+(++clicks)+').';});
fine.addEventListener('change',update);reduced.addEventListener('change',update);update();
</script></body></html>
